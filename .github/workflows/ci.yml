name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  quality:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check lint and formatting
        run: npx biome ci .
