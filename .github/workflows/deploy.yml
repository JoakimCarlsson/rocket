name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Write .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          umask 077
          printf '%s\n' "$ENV_FILE" > .env

      - name: Build
        run: docker compose build api

      - name: Migrate
        run: |
          docker compose up -d --wait postgres
          docker compose run --rm -T migrate

      - name: Deploy
        run: docker compose up -d --remove-orphans

      - name: Verify the app is serving
        run: |
          for i in $(seq 1 30); do
            id=$(docker compose ps -q api)
            if [ -z "$id" ] || [ "$(docker inspect -f '{{.State.Running}}' "$id")" != "true" ]; then
              echo "api is not running after $i attempt(s)"
              break
            fi
            if response=$(curl -fsS --max-time 5 http://localhost:3002/api/ai); then
              case "$response" in
                *'"available":true'*) exit 0 ;;
              esac
            fi
            sleep 2
          done
          docker compose ps -a
          docker compose logs --tail=100
          exit 1
